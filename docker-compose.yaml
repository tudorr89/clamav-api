# Two services:
#   clamav - the official ClamAV daemon (clamd)
#   api    - a small Flask/waitress wrapper exposing POST /scan and GET /health

services:
  clamav:
    image: clamav/clamav:1.5
    platform: linux/amd64
    container_name: clamav_engine
    restart: unless-stopped
    environment:
      # clamd's defaults (100 MiB stream / 400 MiB scan) silently reject the
      # large PDFs this API is meant to accept, so align them with the API's
      # upload limit. INSTREAM is what scan_stream() uses.
      CLAMD_CONF_StreamMaxLength: "550M"
      CLAMD_CONF_MaxFileSize: "550M"
      CLAMD_CONF_MaxScanSize: "1G"
      CLAMD_CONF_MaxScanTime: "300000"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - antivirus-net

  api:
    container_name: clamav_api
    platform: linux/amd64
    build: ./api
    restart: unless-stopped
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Must stay below the client timeout (pdfcompressor AV_TIMEOUT).
      CLAMAV_TIMEOUT: "300"
      MAX_UPLOAD_MB: "550"
    ports:
      - "5001:5000"
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - antivirus-net

networks:
  antivirus-net:
    driver: bridge

volumes:
  clamav_data:
    driver: local
